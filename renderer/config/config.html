<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>WWM CD Overlay — Config</title>
  <link rel="stylesheet" href="config.css">
</head>
<body>
  <h1>WWM CD Overlay</h1>

  <section>
    <label for="playerName">Nom du joueur</label>
    <input id="playerName" type="text" placeholder="Votre pseudo" maxlength="20">
  </section>

  <section>
    <label for="roomId">Room ID</label>
    <input id="roomId" type="text" placeholder="ex: room-abc123" maxlength="30">
  </section>

  <section>
    <label for="signalingURL">Serveur de signaling</label>
    <input id="signalingURL" type="text" placeholder="wss://votre-serveur.railway.app">
  </section>

  <section>
    <label>Zone de capture</label>
    <select id="sourceSelect"></select>
    <div id="calibrationStatus">Aucune zone configurée</div>
    <button id="btnCalibrate">Sélectionner zone</button>
  </section>

  <section>
    <label>Position de l'overlay</label>
    <div class="bounds-row">
      <label>X <input id="overlayX" type="number" placeholder="auto"></label>
      <label>Y <input id="overlayY" type="number" placeholder="auto"></label>
      <label>Largeur <input id="overlayW" type="number" placeholder="650" min="100"></label>
    </div>
    <button id="btnApplyBounds">Appliquer</button>
  </section>

  <section>
    <label>Apparence des tiles</label>
    <div class="slider-row">
      <label>Taille des tiles <span id="tileSizeVal">120</span>px</label>
      <input id="tileSize" type="range" min="60" max="200" step="4" value="120">
    </div>
    <div class="slider-row">
      <label>Taille des noms <span id="nameSizeVal">10</span>px</label>
      <input id="nameSize" type="range" min="8" max="24" step="1" value="10">
    </div>
    <div class="radio-group">
      <span>Direction</span>
      <label><input type="radio" name="direction" value="horizontal"> Horizontal</label>
      <label><input type="radio" name="direction" value="vertical"> Vertical</label>
    </div>
    <div class="slider-row">
      <label>Activer multi-ligne après <span id="thresholdVal">4</span> tiles</label>
      <input id="threshold" type="range" min="1" max="8" step="1" value="4">
    </div>
    <div class="slider-row" id="maxRowsRow">
      <label>Nombre de lignes max : <span id="maxRowsVal">2</span></label>
      <input id="maxRows" type="range" min="1" max="4" step="1" value="2">
    </div>
    <div class="slider-row" id="maxColsRow">
      <label>Nombre de colonnes max : <span id="maxColsVal">2</span></label>
      <input id="maxCols" type="range" min="1" max="4" step="1" value="2">
    </div>
  </section>

  <section class="actions">
    <button id="btnConnect" class="primary">Rejoindre</button>
    <button id="btnDisconnect" disabled>Déconnecter</button>
    <button id="btnToggleOverlay">Cacher l'overlay</button>
  </section>

  <script src="config.js"></script>
</body>
</html>
